# kata-agent (installed into the rootfs post-dracut by kata-osbuilder.sh
# via a raw `cp -ar`, not through package dependency resolution) is
# dynamically linked against libseccomp, but dracut builds the initrd
# with hostonly="no" and has no visibility into that binary at build
# time. Without this, the agent fails at boot with:
#   kata-agent: error while loading shared libraries: libseccomp.so.2
# Force it into the generated rootfs explicitly.
install_items+=" /usr/lib64/libseccomp.so.2 "
